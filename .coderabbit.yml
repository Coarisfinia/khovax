# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Keep every other setting from the CodeRabbit UI.
inheritance: true
reviews:
  # CodeRabbit only comments. A CHANGES_REQUESTED review from it blocks the merge
  # queue until someone dismisses it, even after its findings are fixed or answered.
  request_changes_workflow: false
