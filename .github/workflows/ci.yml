name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2
  # Same version as tools/scoop/gdstyle.json; the checksum is of the Linux release archive.
  GDSTYLE_VERSION: 0.3.3
  GDSTYLE_SHA256: afc3c7a1b9fba219a2eeb2b3896470babffe010b6cf9f3a8c9526a2f6155d64c

jobs:
  headless:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install gdstyle
        run: |
          curl -fsSL -o /tmp/gdstyle.tar.gz \
            "https://github.com/atelico/gdstyle/releases/download/v${GDSTYLE_VERSION}/gdstyle-x86_64-unknown-linux-gnu.tar.gz"
          echo "${GDSTYLE_SHA256}  /tmp/gdstyle.tar.gz" | sha256sum --check
          sudo tar xzf /tmp/gdstyle.tar.gz -C /usr/local/bin gdstyle

      - name: Lint GDScript
        run: gdstyle check --no-color .

      - name: Check GDScript formatting
        run: gdstyle fmt --check .

      - name: Keep the simulation deterministic
        # sim/ holds the rules: plain RefCounted classes without nodes, input, time, engine or OS
        # state, global randomness, frame delta or floats (see AGENTS.md, "Architecture").
        # Comments are stripped first, so the rules can be explained in them.
        run: |
          forbidden='\b(Node|Node2D|Node3D|CanvasItem|Control|Window|Viewport|Resource)\b|\b(Input|InputMap|Time|Engine|OS|DisplayServer|RenderingServer|ProjectSettings)\.|\b(randf|randi|randf_range|randi_range|randfn|randomize|seed|rand_from_seed)\(|\bdelta\b|\bfloat\b|[0-9]\.[0-9]|[0-9][eE][-+]?[0-9]'
          failed=0
          while read -r file; do
            code=$(sed 's/#.*$//' "$file")
            if ! grep -qx 'extends RefCounted' <<< "$code"; then
              echo "::error file=${file}::sim/ scripts extend RefCounted"
              failed=1
            fi
            if grep -nE "$forbidden" <<< "$code"; then
              echo "::error file=${file}::sim/ must stay deterministic: see the lines above"
              failed=1
            fi
          done < <(find sim -name '*.gd')
          exit "$failed"

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot

      - name: Import project
        run: timeout 120 ~/godot/godot --headless --path . --import

      - name: Check every script with Godot's warnings as errors
        # Also catches scripts that no test loads.
        run: |
          git ls-files '*.gd' | while read -r script; do
            timeout 60 ~/godot/godot --headless --path . --check-only -s "res://${script}" \
              || { echo "::error file=${script}::fails Godot's script check"; exit 1; }
          done

      - name: Run e2e tests
        # timeout guards against a script error in the runner leaving the SceneTree running forever
        run: timeout 300 ~/godot/godot --headless --path . -s res://tests/e2e/run_e2e.gd
