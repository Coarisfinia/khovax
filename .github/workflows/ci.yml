name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue (#329) checks each pull request on top of the ones queued before it.
  merge_group:

permissions:
  contents: read

# A new push to a pull request cancels that pull request's run for the previous commit. Every run
# on main gets its own group, so none is ever cancelled or queued behind another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  # Godot's version and checksums are pinned once, in .github/actions/setup-godot (#924).
  # gdstyle's version is pinned once, in tools/scoop/gdstyle.json (#1124), which the install step
  # reads; this checksum is of that version's Linux release archive, so bump it with the manifest.
  GDSTYLE_SHA256: afc3c7a1b9fba219a2eeb2b3896470babffe010b6cf9f3a8c9526a2f6155d64c
  # jscpd, the duplicate-code check (#247); the checksum is of its Linux release archive, from the
  # release's checksums.txt.
  JSCPD_VERSION: 5.4.1
  JSCPD_SHA256: f2017a17de2a8d5708f8354c6e7223f82da3dc6489675bce543ba00d9d529468
  # jv, the JSON Schema validator for the content data (#72); the checksum is of its Linux release
  # archive, as GitHub records it for the release asset.
  JV_VERSION: 6.0.3
  JV_SHA256: 36e9ab8481cc8e2cb27c8336decc9abdcbd606b05792ca88d6188e01ec28766b
  # uv runs the Python tooling (#1036) and installs the Python pyproject.toml pins, which it checks
  # against the checksums built into this release; the checksum is of its Linux release archive,
  # from the release's .sha256 file. Locally it comes from scoop or Homebrew.
  UV_VERSION: 0.13.4
  UV_SHA256: 2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f
  # The web e2e flow's browser (#102); the checksum is of its Linux archive. Playwright, which
  # drives it, is locked in uv.lock (packages/game-web-e2e, #1041).
  CHROME_VERSION: 156.0.8078.12
  CHROME_SHA256: f56185000c18aa2471911e2b8fbd96c3175bcc7553e78c002371bb18a9fa69e9
  # Playwright's own ffmpeg build, which records the run's video; the revision is the one the
  # locked Playwright's driver names in its browsers.json.
  PLAYWRIGHT_FFMPEG_REVISION: 1013
  PLAYWRIGHT_FFMPEG_SHA256: ee986434d158f74fb5d9c5ff1092026ceedb63f324fe90b5be89460926b7b679

jobs:
  headless:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # Every step runs in the game's project (#1101): Godot's paths, the builds and the checks'
    # git paths are its own; the Python tooling is beside it, in ../<package>/.
    defaults:
      run:
        working-directory: packages/game
    steps:
      - name: "📥 Check out the code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No token left in .git/config while the branch's own code runs (#928).
          persist-credentials: false
          # The parent too: the rules changes check compares with it.
          fetch-depth: 2

      - name: "🧰 Install gdstyle (the linter)"
        run: |
          version=$(jq -er .version ../../tools/scoop/gdstyle.json)
          curl -fsSL -o /tmp/gdstyle.tar.gz \
            "https://github.com/atelico/gdstyle/releases/download/v${version}/gdstyle-x86_64-unknown-linux-gnu.tar.gz"
          echo "${GDSTYLE_SHA256}  /tmp/gdstyle.tar.gz" | sha256sum --check
          sudo tar xzf /tmp/gdstyle.tar.gz -C /usr/local/bin gdstyle

      - name: "🔍 Lint GDScript"
        # Every rule on every script, except the file length (owner, #335): tests are exempt from it,
        # so it's checked on its own over every script outside tests/.
        run: |
          gdstyle check --no-color --ignore quality/max-file-length .
          git ls-files -z '*.gd' ':!tests/' | xargs -0 gdstyle check --no-color --select quality/max-file-length

      - name: "🎨 Check GDScript formatting"
        run: gdstyle fmt --check .

      - name: "🧰 Install jscpd (the duplicate-code check)"
        run: |
          curl -fsSL -o /tmp/jscpd.tar.gz \
            "https://github.com/kucherenko/jscpd/releases/download/v${JSCPD_VERSION}/jscpd-linux-x64-gnu.tar.gz"
          echo "${JSCPD_SHA256}  /tmp/jscpd.tar.gz" | sha256sum --check
          sudo tar xzf /tmp/jscpd.tar.gz -C /usr/local/bin jscpd

      - name: "♊ Check GDScript for copied code"
        # Any clone of its default minimum size fails, game code and tests alike: shared code goes
        # into one place (AGENTS.md, "Single responsibility").
        run: jscpd --format gdscript --exit-code 1 --reporters console --no-colors .

      - name: "🧰 Install uv (the Python tooling's runner)"
        run: |
          curl -fsSL -o /tmp/uv.tar.gz \
            "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz"
          echo "${UV_SHA256}  /tmp/uv.tar.gz" | sha256sum --check
          sudo tar xzf /tmp/uv.tar.gz -C /usr/local/bin --strip-components=1 \
            uv-x86_64-unknown-linux-gnu/uv

      - name: "🐍 Check the uv project is locked and runs"
        # uv.lock matches pyproject.toml, and the pinned Python runs from it: the ported tools
        # (#1036) run the same way, with `uv run --locked`.
        run: |
          uv lock --check
          uv run --locked python -c 'import sys; print(f"Python {sys.version}")'

      - name: "🧹 Check every declared function, variable, constant and class is used"
        # Godot's script check already fails on unused locals, parameters and signals; this finds
        # what nothing in the whole project names (#315).
        run: uv run --locked --package khovax-game-checks ../game-checks/unused_code.py

      - name: "🧭 Check the core never depends on a slice and paths are absolute"
        run: uv run --locked --package khovax-game-checks ../game-checks/import_rules.py

      - name: "📁 Check no path repeats a folder name"
        run: uv run --locked --package khovax-game-checks ../game-checks/repeated_folders.py

      - name: "📄 Check every file's ending is allowed"
        # Today's endings without .sh and .bat (owner, #1095); a new one needs the owner's sign-off.
        run: uv run --locked --package khovax-game-checks ../game-checks/file_endings.py

      - name: "🐺 Check every creature model has every creature clip"
        # The set is named once, in the model library's lib/clip_set.py, which the build reads too (#1157).
        run: uv run --locked --package khovax-game-models ../game-models/check_clip_set.py

      - name: "🗃️ Check the export presets share their file filters and web loading page"
        run: uv run --locked --package khovax-game-checks ../game-checks/export_filters_check.py

      - name: "🎲 Check the simulation stays deterministic"
        # core/ and every slice's rules/ never use nodes, time, floats, files or JSON (#572); the
        # forbidden list and the exemption marker (#515) are in the script.
        timeout-minutes: 5
        run: uv run --locked --package khovax-game-checks ../game-checks/determinism_check.py

      - name: "🔖 Check the rule change files"
        # The parent is the base on a pull request's merge commit, the queue's previous commit in
        # the merge queue, and the previous commit on main (squash merges only).
        run: uv run --locked --package khovax-game-checks ../game-checks/rules_changes_check.py HEAD^1

      - name: "🤖 Set up Godot and import the project"
        uses: ./.github/actions/setup-godot

      - name: "📜 Check CREDITS.md matches the assets"
        # tools/godot/credits.gd writes it from every assets/<pack>/SOURCE.md; a difference means an asset
        # was added or changed without regenerating the credits.
        run: |
          # Godot exits 0 on a script error, which would leave an old CREDITS.md looking current.
          timeout 60 ~/godot/godot --headless --path . -s res://tools/godot/credits.gd 2>&1 | tee /tmp/credits.log
          test "${PIPESTATUS[0]}" -eq 0
          if grep -q "SCRIPT ERROR" /tmp/credits.log; then
            echo "::error file=packages/game/tools/godot/credits.gd::the credits tool hit a script error"
            exit 1
          fi
          if ! git diff --exit-code CREDITS.md || [ -n "$(git status --porcelain CREDITS.md)" ]; then
            echo "::error file=packages/game/CREDITS.md::out of date: run tools/godot/credits.gd and commit the result"
            exit 1
          fi

      - name: "📦 Check every asset is used"
        # Commit only what the game uses (AGENTS.md, #69): every file under assets/ is named by a
        # scene, script, content file or setting, or by a glTF that is (#320).
        run: uv run --locked --package khovax-game-checks ../game-checks/unused_assets.py

      - name: "🗂️ Check the content data against its schemas"
        # Each kind's content files, as Godot's data_to_json.gd writes them, against its schema;
        # the rules for which schema checks which folder are in the check itself.
        run: |
          curl -fsSL -o /tmp/jv.tar.gz \
            "https://github.com/santhosh-tekuri/jsonschema/releases/download/v${JV_VERSION}/jv-v${JV_VERSION}-linux-amd64.tar.gz"
          echo "${JV_SHA256}  /tmp/jv.tar.gz" | sha256sum --check
          mkdir -p /tmp/jv && tar xzf /tmp/jv.tar.gz -C /tmp/jv
          GODOT=~/godot/godot JV=$(find /tmp/jv -type f -name jv | head -1) \
            uv run --locked --package khovax-game-checks ../game-checks/content_schemas_check.py

      - name: "🔎 Check every script (warnings as errors)"
        # Also catches scripts that no test loads. An ERROR: line fails the step too, even when
        # Godot exits with 0 (such as a load cycle through a preloaded scene, #964). The scripts are
        # checked in parallel and every failing one is named (#923).
        run: GODOT=~/godot/godot uv run --locked --package khovax-game-checks ../game-checks/script_check.py

      - name: "🧪 Run the headless e2e tests"
        # timeout guards against a script error in the runner leaving the SceneTree running forever
        run: timeout 300 ~/godot/godot --headless --path . -s res://tests/e2e/run_e2e.gd -- --seed=0

      - name: "⏱️ Load test: a tick is within its budget and no slower than the base's"
        # The load test (tools/godot/load_test.gd, #101) times every tick and every feature headless. On a
        # pull request it runs on the base branch too, in this job on this runner, so the two
        # compare fairly (#303); the numbers go into the job's summary either way. A tick over its fixed
        # budget fails with or without a base (#1337, load_test_compare.py).
        run: |
          set -o pipefail
          timeout 120 ~/godot/godot --headless --path . -s res://tools/godot/load_test.gd -- ticks=2000 \
            | tee /tmp/load-head.txt
          if [ "${{ github.event_name }}" = pull_request ]; then
            git fetch -q --depth=1 origin "${{ github.base_ref }}"
            git worktree add -q /tmp/base FETCH_HEAD
            # The base's game: in packages/game, or at its root before the move there (#1101).
            base=/tmp/base/packages/game
            [ -f "$base/project.godot" ] || base=/tmp/base
            # A base that fails its own load test is the base's problem: this branch is then
            # reported without a comparison, and nothing of the failed run is compared.
            if timeout 120 ~/godot/godot --headless --path "$base" --import > /dev/null 2>&1 \
              && timeout 120 ~/godot/godot --headless --path "$base" -s res://tools/godot/load_test.gd \
                -- ticks=2000 > /tmp/load-base.txt 2>&1; then
              cat /tmp/load-base.txt
            else
              echo "::warning::The base's load test failed, so there's nothing to compare against."
              rm -f /tmp/load-base.txt
            fi
          fi
          uv run --locked ../game-replays/load_test_compare.py /tmp/load-head.txt /tmp/load-base.txt \
            | tee -a "$GITHUB_STEP_SUMMARY"

  models:
    # The model checks (#1357): every scripted model rebuilt and checked in Blender, which takes
    # most of ten minutes on its own, so it runs beside headless rather than inside its time limit.
    # It always runs, and only sets up Blender where a model or its build changed.
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/game
    steps:
      - name: "📥 Check out the code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No token left in .git/config while the branch's own code runs (#928).
          persist-credentials: false
          # The parent too: whether a model changed is read against it.
          fetch-depth: 2

      - name: "🧰 Install uv (the Python tooling's runner)"
        run: |
          curl -fsSL -o /tmp/uv.tar.gz \
            "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz"
          echo "${UV_SHA256}  /tmp/uv.tar.gz" | sha256sum --check
          sudo tar xzf /tmp/uv.tar.gz -C /usr/local/bin --strip-components=1 \
            uv-x86_64-unknown-linux-gnu/uv

      - name: "🔀 See whether a model or its build changed"
        id: models
        # The rebuild check below needs Blender, so it runs only where it can find something: a
        # change to the model scripts and their library, to a .glb or its .import (whose clip rate
        # the checks sample at), or to Blender's pin, against the parent. A failing diff counts as
        # a change, so the check runs rather than being skipped.
        run: |
          if git diff --quiet HEAD^1 -- ':(top)packages/game-models' ':(top)*.glb' ':(top)*.glb.import' \
            ':(top).github/actions/setup-blender'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: "🧊 Set up Blender"
        if: steps.models.outputs.changed == 'true'
        uses: ./.github/actions/setup-blender

      - name: "🐺 Check every scripted model's .glb is what its script builds"
        # Builds each model twice and compares the bytes with each other and the committed .glb
        # (#1085, #1161); a difference is an error annotation naming the model and what differs.
        if: steps.models.outputs.changed == 'true'
        timeout-minutes: 5
        run: uv run --locked --package khovax-game-models ../game-models/check_rebuild.py --all --keep /tmp/rebuilt

      - name: "🫧 Check no wisp cuts into a model's body"
        # Every frame of every clip of every .glb in the game (#1227); a model without wisps passes.
        if: steps.models.outputs.changed == 'true'
        timeout-minutes: 5
        run: |
          git ls-files -z ':(top)packages/game/*.glb' | xargs -0 uv run --locked --package khovax-game-models \
            ../game-models/blender.py --background --factory-startup \
            --python ../game-models/check_clearance.py --

      - name: "👁️ Check no eye shows above its brow"
        # Every other frame of every clip of every .glb, each eye from the front, its side and
        # straight on (the owner, on #1249); a model without eye points passes.
        if: steps.models.outputs.changed == 'true'
        timeout-minutes: 5
        run: |
          git ls-files -z ':(top)packages/game/*.glb' | xargs -0 uv run --locked --package khovax-game-models \
            ../game-models/blender.py --background --factory-startup \
            --python ../game-models/check_brows.py --

      - name: "🦴 Check every model's limbs have sane dimensions"
        # Each limb's segments against each other and the body's height, at rest, per body plan
        # (the owner, on #1297); a model without limbs of a known body plan passes.
        if: steps.models.outputs.changed == 'true'
        timeout-minutes: 5
        run: |
          git ls-files -z ':(top)packages/game/*.glb' | xargs -0 -r uv run --locked --package khovax-game-models \
            ../game-models/blender.py --background --factory-startup \
            --python ../game-models/check_dimensions.py --

      - name: "🫁 Check every model keeps its volume where its spine and neck bend"
        # Every frame of every clip of every .glb, the body's depth and width along its spine and
        # neck against rest (the owner, on #1305); a model without spine or neck bones passes.
        if: steps.models.outputs.changed == 'true'
        timeout-minutes: 5
        run: |
          git ls-files -z ':(top)packages/game/*.glb' | xargs -0 -r uv run --locked --package khovax-game-models \
            ../game-models/blender.py --background --factory-startup \
            --python ../game-models/check_volume.py --

      - name: "🧪 Test the attached-part check on a box"
        # A part that stays, dips, lifts off and sinks in (#1458): the check passes and fails them.
        if: steps.models.outputs.changed == 'true'
        timeout-minutes: 2
        run: |
          uv run --locked --package khovax-game-models ../game-models/blender.py --background --factory-startup \
            --python ../game-models/test_connectivity.py

      - name: "💎 Check every attached part stays on the skin"
        # Every frame of every clip of every .glb, each part's gap to the piece it sits on against
        # its gap at rest (#1403, split off #1303), and how far it sinks in (#1458); a model of one
        # piece passes.
        if: steps.models.outputs.changed == 'true'
        timeout-minutes: 5
        run: |
          git ls-files -z ':(top)packages/game/*.glb' | xargs -0 -r uv run --locked --package khovax-game-models \
            ../game-models/blender.py --background --factory-startup \
            --python ../game-models/check_connectivity.py --

      - name: "🧪 Test the hex footprint check on boxes"
        # Monsters, props and static models that fit their hex or are too big for it (#1641): the
        # check passes and fails them.
        if: steps.models.outputs.changed == 'true'
        timeout-minutes: 2
        run: |
          uv run --locked --package khovax-game-models ../game-models/blender.py --background --factory-startup \
            --python ../game-models/test_footprint.py

      - name: "⬡ Check every monster and prop stays within its hex"
        # Every frame of every clip of every .glb built by a script here, how far the mesh reaches
        # across the hex the game stands it on, seen from above (#1520); a prop is held to limits
        # of its own, a static one by its rest pose, and none is let off through a list (#1641); a
        # tile's decoration is the tile's own look and isn't measured (#1651).
        if: steps.models.outputs.changed == 'true'
        timeout-minutes: 5
        run: |
          git ls-files -z ':(top)packages/game/*.glb' | xargs -0 -r uv run --locked --package khovax-game-models \
            ../game-models/blender.py --background --factory-startup \
            --python ../game-models/check_footprint.py --

      - name: "📤 Upload the models CI built"
        # On a difference, the .glb files this runner built, to compare with or commit.
        if: failure() && steps.models.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rebuilt-models
          path: /tmp/rebuilt/
          if-no-files-found: ignore

  soak:
    # The soak test (#1311, tests/soak/run_soak.gd): the player explores a whole instance for
    # minutes, and the game must not be slower back at the start than it was there at first, in
    # frame time or in draw calls. It takes minutes, so it runs on its own runner, beside the
    # others, under a virtual display with Mesa's software OpenGL so the renderer really draws.
    # Not a required check.
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/game
    steps:
      - name: "📥 Check out the code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No token left in .git/config while the branch's own code runs (#928).
          persist-credentials: false

      - name: "🤖 Set up Godot and import the project"
        uses: ./.github/actions/setup-godot

      - name: "🐢 Soak test: explore an instance, no slower at the end"
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -o pipefail
          timeout 900 xvfb-run -a -s "-screen 0 1280x720x24" ~/godot/godot --path . \
            --rendering-driver opengl3 --audio-driver Dummy -s res://tests/soak/run_soak.gd 2>&1 \
            | tee soak.log

      - name: "📋 Soak test: its measures into the run's summary"
        if: always()
        run: |
          { echo '```'; grep -E "^ *[0-9]+ s:|^the |times|PASS|FAIL" soak.log || true; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"

  rules-compare:
    # Compares how this commit plays with how its parent plays (#876): both are built, each plays
    # the reference replays and the APK flow (tests/replays/outcomes.gd), and a difference needs a
    # new file in core/rules_changes/. The parent is the base on a pull request's merge commit and
    # the queue's previous commit in the merge queue; main itself was checked in the queue, so a
    # push only plays it, for the device jobs, which compare their flow's hash with this one's.
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      # The pull request's labels (#889).
      pull-requests: read
    # Every step runs in the game's project (#1101): Godot's paths, the builds and the checks'
    # git paths are its own; the Python tooling is beside it, in ../<package>/.
    defaults:
      run:
        working-directory: packages/game
    steps:
      - name: "📥 Check out the code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No token left in .git/config while the branch's own code runs (#928).
          persist-credentials: false
          # The parent too: it's built and played beside this commit.
          fetch-depth: 2

      - name: "🤖 Set up Godot"
        # Both commits are imported in the steps below, quietly: the import's script errors are the
        # headless job's to report.
        uses: ./.github/actions/setup-godot
        with:
          import: "false"

      - name: "🧰 Install uv (the Python tooling's runner)"
        if: github.event_name != 'push'
        run: |
          curl -fsSL -o /tmp/uv.tar.gz \
            "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz"
          echo "${UV_SHA256}  /tmp/uv.tar.gz" | sha256sum --check
          sudo tar xzf /tmp/uv.tar.gz -C /usr/local/bin --strip-components=1 \
            uv-x86_64-unknown-linux-gnu/uv

      - name: "🎲 Play this commit"
        # The import's script errors are the headless job's to report.
        run: |
          mkdir -p /tmp/outcomes
          timeout 120 ~/godot/godot --headless --path . --import > /dev/null
          timeout 300 ~/godot/godot --headless --path . -s res://tests/replays/outcomes.gd \
            -- out=/tmp/outcomes/outcomes.json

      - name: "⬆️ 🎲 Outcome report: upload (khovax-outcomes)"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: khovax-outcomes
          path: /tmp/outcomes/outcomes.json
          if-no-files-found: error
          # A rerun (after the outcomes-change label is added) uploads it again.
          overwrite: true

      - name: "🎲 Play its parent"
        # A parent that can't be built or played fails the check: it's main or a queue entry, which
        # would be dropped anyway.
        if: github.event_name != 'push'
        run: |
          git worktree add -q /tmp/parent HEAD^1
          # The parent's game: in packages/game, or at its root before the move there (#1101).
          game=/tmp/parent/packages/game
          [ -f "$game/project.godot" ] || game=/tmp/parent
          timeout 120 ~/godot/godot --headless --path "$game" --import > /dev/null
          timeout 300 ~/godot/godot --headless --path "$game" -s res://tests/replays/outcomes.gd \
            -- out=/tmp/outcomes-parent.json

      - name: "🏷️ Read whether the pull request is labelled outcomes-change"
        # Read when the job runs, so a rerun sees a label added since. In the merge queue, the
        # entry's branch names its pull request: gh-readonly-queue/<base>/pr-<number>-<sha>. The
        # agent adds the label and says why in the pull request; the owner's approval is the gate
        # (owner, #899).
        if: github.event_name != 'push'
        id: label
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
          QUEUE_BRANCH: ${{ github.event.merge_group.head_ref }}
        run: |
          number=${NUMBER:-$(sed -n 's|.*/pr-\([0-9][0-9]*\)-[0-9a-f]*$|\1|p' <<< "$QUEUE_BRANCH")}
          test -n "$number"
          labelled=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}" \
            --jq '[.labels[].name] | index("outcomes-change") != null')
          echo "labelled=${labelled}" >> "$GITHUB_OUTPUT"

      - name: "🔖 Check a different outcome comes with a rules change"
        # The comparison runs from the parent's checkout, with the parent's uv project, so a pull
        # request can't weaken its own check. Only the pull requests that add the script (#876),
        # move it (#1037, #1101, #1114) and port it to Python (#1039) run their own. It reads git
        # from the repository's root.
        if: github.event_name != 'push'
        working-directory: .
        env:
          OUTCOMES_CHANGE: ${{ steps.label.outputs.labelled }}
        run: |
          set -o pipefail
          project=/tmp/parent
          if [ ! -f "$project/packages/game-replays/rules_compare.py" ]; then
            echo "::notice::The parent has no packages/game-replays/rules_compare.py yet (it moved there in #1114), so this commit's own runs."
            project=.
          fi
          uv run --locked --project "$project" --package khovax-game-replays \
            "$project/packages/game-replays/rules_compare.py" \
            /tmp/outcomes-parent.json /tmp/outcomes/outcomes.json HEAD^1 | tee -a "$GITHUB_STEP_SUMMARY"

  export:
    # Every platform's build, from one Godot and export templates download (#168): the debug APK
    # to install on a phone (#59, with the Android SDK and Java already on the runner and a
    # throwaway debug key: no secrets), and the desktop, web and test builds the e2e jobs run.
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    # Every step runs in the game's project (#1101): Godot's paths, the builds and the checks'
    # git paths are its own; the Python tooling is beside it, in ../<package>/.
    defaults:
      run:
        working-directory: packages/game
    outputs:
      # The version the builds carry, which dev-release tags them with (#744).
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: "📥 Check out the code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No token left in .git/config while the branch's own code runs (#928).
          persist-credentials: false

      - name: "🏷️ Stamp the build's version"
        # v<next>-dev.<run number> (#747), <next> being the patch after the last prod release (a
        # full release, never a prerelease), or config/version while there is none. Every run's
        # builds carry it, though only a push to main publishes it, as dev-release's tag. It goes
        # into its own setting, which BuildVersion.SETTING reads: Godot refuses anything but
        # numbers in config/version for the Windows and Android version fields (#744).
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The last prod release's tag, or nothing when there is none (#1329). Any other error (a
          # rate limit, an outage) fails the job, so it is never mistaken for "none", which could put
          # an immutable tag on the wrong version.
          if ! last=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName \
            2> "$RUNNER_TEMP/release-view.err"); then
            if [ "$(< "$RUNNER_TEMP/release-view.err")" != 'release not found' ]; then
              cat "$RUNNER_TEMP/release-view.err" >&2
              exit 1
            fi
            last=
          fi
          if [[ "$last" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            next="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
          else
            next=$(awk -F'"' '/^\[/ { section = $0 } section == "[application]" && /^config\/version="/ { print $2 }' project.godot)
          fi
          if ! [[ "$next" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::no x.y.z version to build on: last prod release \"${last}\", config/version \"${next}\""
            exit 1
          fi
          tag="v${next}-dev.${GITHUB_RUN_NUMBER}"
          printf '\n[khovax]\n\nbuild_version="%s"\n' "$tag" >> project.godot
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Builds carry ${tag}"

      - name: "🤖 Android: point Godot at the SDK and Java"
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME_17_X64}"
          SETTINGS

      - name: "🔑 Android: make a throwaway debug key"
        run: |
          keytool -genkeypair -v -keystore /tmp/debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: "🤖 Set up Godot and its export templates, and import the project"
        uses: ./.github/actions/setup-godot
        with:
          templates: "true"

      - name: "🤖 Android: export the debug APK and the test APK"
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /tmp/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          timeout 300 ~/godot/godot --headless --path . --export-debug "Android" build/khovax.apk
          test -s build/khovax.apk
          # The test APK for the emulator: x86_64, with the APK's e2e flow (tests/apk/) inside.
          timeout 300 ~/godot/godot --headless --path . --export-debug "Android Test" build/khovax-test.apk
          test -s build/khovax-test.apk

      - name: "⬆️ 🤖 Android debug APK: upload (khovax-debug-apk)"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: khovax-debug-apk
          path: packages/game/build/khovax.apk
          retention-days: 14

      - name: "🪟 Windows: export the release build"
        # The release's build (#21), exported on every push too, so the preset can't break unseen.
        # One .exe with the game embedded; release.yml exports it the same way for a version tag.
        run: |
          timeout 300 ~/godot/godot --headless --path . --export-release "Windows Desktop" build/khovax.exe
          test -s build/khovax.exe

      - name: "🐧 Linux: export the release build"
        # One x86_64 executable with the game embedded (#92); release.yml exports it the same way.
        run: |
          timeout 300 ~/godot/godot --headless --path . --export-release "Linux" build/khovax.x86_64
          test -s build/khovax.x86_64

      - name: "⬆️ 🐧 Linux build: upload (khovax-linux)"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: khovax-linux
          path: packages/game/build/khovax.x86_64
          retention-days: 14

      - name: "🧪 🐧 Linux: export the test build"
        # The Linux build with the device e2e flow in it (#113), for the linux-e2e job.
        run: |
          timeout 300 ~/godot/godot --headless --path . --export-release "Linux Test" build/khovax-test.x86_64
          test -s build/khovax-test.x86_64

      - name: "⬆️ 🧪 🐧 Linux test build: upload (khovax-linux-test)"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: khovax-linux-test
          path: packages/game/build/khovax-test.x86_64
          retention-days: 3

      - name: "🌐 Web: export the release build"
        # Single-threaded (#22): it runs without SharedArrayBuffer, so static hosts that can't send
        # cross-origin isolation headers (GitHub Pages) serve it as is.
        run: |
          mkdir -p build/web
          timeout 300 ~/godot/godot --headless --path . --export-release "Web" build/web/index.html
          test -s build/web/index.html && test -s build/web/index.wasm && test -s build/web/index.pck

      - name: "⬆️ 🌐 Web build: upload (khovax-web)"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: khovax-web
          path: packages/game/build/web/
          retention-days: 14

      - name: "🧪 🌐 Web: export the test build"
        # The web build with the device e2e flow in it (#102), for the web-e2e job.
        run: |
          mkdir -p build/web-test
          timeout 300 ~/godot/godot --headless --path . --export-release "Web Test" build/web-test/index.html
          test -s build/web-test/index.html && test -s build/web-test/index.pck

      - name: "⬆️ 🧪 🌐 Web test build: upload (khovax-web-test)"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: khovax-web-test
          path: packages/game/build/web-test/
          retention-days: 3

      - name: "⬆️ 🪟 Windows build: upload (khovax-windows)"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: khovax-windows
          path: packages/game/build/khovax.exe
          retention-days: 14

      - name: "⬆️ 🧪 Android test APK: upload (khovax-test-apk)"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: khovax-test-apk
          path: packages/game/build/khovax-test.apk
          retention-days: 3

  apk-e2e:
    # The one e2e flow on the APK (#61), on an Android emulator: the test APK's flow walks the player
    # with the touch stick from a fixed seed and must end in the state the headless run of the same
    # commit ended in (rules-compare's outcome report, #876).
    needs: [export, rules-compare]
    # rules-compare isn't a required check (owner, #894), and a job skipped because a job it needs
    # failed counts as passed for a required check. So this required one runs anyway, unless the
    # whole run was cancelled, and fails first when a job it needs didn't succeed: a failing
    # rules-compare then keeps the merge queue from merging.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: "🔗 Check the jobs it needs succeeded"
        env:
          EXPORT: ${{ needs.export.result }}
          RULES_COMPARE: ${{ needs.rules-compare.result }}
        run: |
          if [ "$EXPORT" != success ] || [ "$RULES_COMPARE" != success ]; then
            echo "::error::export ${EXPORT}, rules-compare ${RULES_COMPARE}: both must succeed"
            exit 1
          fi

      - name: "📥 Check out the code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No token left in .git/config while the branch's own code runs (#928).
          persist-credentials: false

      - name: "⬇️ 🧪 Android test APK: download (khovax-test-apk)"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: khovax-test-apk
          path: build

      - name: "⬇️ 🎲 Outcome report: download (khovax-outcomes)"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: khovax-outcomes
          path: outcomes

      - name: "🎲 Read the headless run's final hash of the flow"
        run: |
          hash=$(jq -er .apk_flow.final outcomes/outcomes.json)
          echo "EXPECTED_HASH=${hash}" >> "$GITHUB_ENV"

      - name: "🧰 Install uv (the Python tooling's runner)"
        run: |
          curl -fsSL -o /tmp/uv.tar.gz \
            "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz"
          echo "${UV_SHA256}  /tmp/uv.tar.gz" | sha256sum --check
          sudo tar xzf /tmp/uv.tar.gz -C /usr/local/bin --strip-components=1 \
            uv-x86_64-unknown-linux-gnu/uv

      - name: "🐍 Install the pinned Python"
        # Here, so the emulator step's timeout isn't spent downloading it.
        run: uv run --locked python -c 'import sys; print(f"Python {sys.version}")'

      - name: "⚙️ Emulator: enable KVM"
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator and its system image come from Google's servers on every run, and a broken
      # download once failed this required check before any test ran (#196). Kept in the cache and
      # installed with retries before the emulator action, whose own install then finds them in
      # place. The action always installs its channel's newest emulator, so this doesn't pin it: a
      # new stable release is downloaded once, with retries, and saved under its own key, made from
      # the installed packages' revision files (a cache entry can't be overwritten).
      - name: "💾 Android emulator: restore the cache (emulator and system image)"
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /usr/local/lib/android/sdk/emulator
            /usr/local/lib/android/sdk/system-images/android-34/default/x86_64
          key: android-emulator-34-x86_64-
          restore-keys: android-emulator-34-x86_64-

      - name: "⬇️ Android emulator: install, retrying a broken download"
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          for attempt in 1 2 3; do
            if "$sdkmanager" --install emulator 'system-images;android-34;default;x86_64' > /dev/null
            then
              exit 0
            fi
            echo "SDK download failed (attempt $attempt), trying again"
            sleep 15
          done
          exit 1

      # hashFiles() only reads the workspace, and the SDK lies outside it.
      - name: "🔑 Android emulator: name the cache after the installed revisions"
        id: emulator-revisions
        run: |
          sdk=/usr/local/lib/android/sdk
          revisions=$(cat "$sdk/emulator/package.xml" \
            "$sdk/system-images/android-34/default/x86_64/package.xml" | sha256sum | cut -c1-16)
          echo "key=android-emulator-34-x86_64-$revisions" >> "$GITHUB_OUTPUT"

      - name: "💾 Android emulator: save the cache under the installed revisions"
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /usr/local/lib/android/sdk/emulator
            /usr/local/lib/android/sdk/system-images/android-34/default/x86_64
          key: ${{ steps.emulator-revisions.outputs.key }}

      - name: "📱 Android test APK: run the e2e flow on an emulator"
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          # ANGLE on the software GPU: the plain software GPU (swiftshader_indirect) caps fragment
          # uniforms below what Godot's Compatibility shaders need, so they failed to link (#114).
          emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: timeout 480 uv run --locked packages/game-replays/apk_e2e.py build/khovax-test.apk "$EXPECTED_HASH"

  linux-e2e:
    # The same device flow on the Linux build (#113), played by the runner itself under a virtual
    # display with Mesa's software OpenGL, so the renderer really draws. The test build quits with
    # the flow's result as its exit code (game/test_mode.gd), and must end in the state the headless
    # run of the same commit ended in (rules-compare's outcome report, #876).
    needs: [export, rules-compare]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: "⬇️ 🧪 🐧 Linux test build: download (khovax-linux-test)"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: khovax-linux-test
          path: build

      - name: "⬇️ 🎲 Outcome report: download (khovax-outcomes)"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: khovax-outcomes
          path: outcomes

      - name: "🎲 Read the headless run's final hash of the flow"
        run: |
          hash=$(jq -er .apk_flow.final outcomes/outcomes.json)
          echo "EXPECTED_HASH=${hash}" >> "$GITHUB_ENV"

      - name: "🐧 Linux test build: run the e2e flow under a virtual display"
        # The game's exit code and its result line both have to say pass.
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -o pipefail
          chmod +x build/khovax-test.x86_64
          timeout 300 xvfb-run -a -s "-screen 0 1280x720x24" build/khovax-test.x86_64 | tee linux-e2e.log
          grep -qx "KHOVAX_E2E: PASS ${EXPECTED_HASH}" linux-e2e.log \
            || { echo "::error::the flow didn't pass in the headless run's state ${EXPECTED_HASH}"; exit 1; }

  web-e2e:
    # The same device flow on the web build (#102), in headless Chrome: it must end in the state the
    # headless run of the same commit ended in (rules-compare's outcome report, #876), with nothing
    # on the browser's console marked as an error.
    needs: [export, rules-compare]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: "📥 Check out the code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No token left in .git/config while the branch's own code runs (#928).
          persist-credentials: false

      - name: "⬇️ 🧪 🌐 Web test build: download (khovax-web-test)"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: khovax-web-test
          path: build/web-test

      - name: "⬇️ 🎲 Outcome report: download (khovax-outcomes)"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: khovax-outcomes
          path: outcomes

      - name: "🎲 Read the headless run's final hash of the flow"
        run: |
          hash=$(jq -er .apk_flow.final outcomes/outcomes.json)
          echo "EXPECTED_HASH=${hash}" >> "$GITHUB_ENV"

      - name: "🧰 Install uv (the Python tooling's runner)"
        run: |
          curl -fsSL -o /tmp/uv.tar.gz \
            "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz"
          echo "${UV_SHA256}  /tmp/uv.tar.gz" | sha256sum --check
          sudo tar xzf /tmp/uv.tar.gz -C /usr/local/bin --strip-components=1 \
            uv-x86_64-unknown-linux-gnu/uv

      - name: "⬇️ Download Chrome (headless shell) and Playwright's ffmpeg"
        run: |
          curl -fsSL -o chrome.zip \
            "https://storage.googleapis.com/chrome-for-testing-public/${CHROME_VERSION}/linux64/chrome-headless-shell-linux64.zip"
          echo "${CHROME_SHA256}  chrome.zip" | sha256sum -c -
          curl -fsSL -o ffmpeg.zip \
            "https://cdn.playwright.dev/dbazure/download/playwright/builds/ffmpeg/${PLAYWRIGHT_FFMPEG_REVISION}/ffmpeg-linux.zip"
          echo "${PLAYWRIGHT_FFMPEG_SHA256}  ffmpeg.zip" | sha256sum -c -
          unzip -q chrome.zip -d ~/tools
          mkdir -p ~/tools/playwright
          unzip -q ffmpeg.zip -d ~/tools/playwright/ffmpeg-${PLAYWRIGHT_FFMPEG_REVISION}

      - name: "📦 Install the runner's dependencies (locked)"
        run: uv sync --locked --package khovax-game-web-e2e

      - name: "📦 Install Mesa's software renderer"
        # WebGL 2 comes from Mesa's llvmpipe (#252): on Chrome's own SwiftShader the page sometimes
        # froze for good. From the named runner image's signed Ubuntu archive, so its version
        # follows the image's Mesa. apt retries a mirror's passing errors (#1429).
        run: |
          sudo apt-get -o Acquire::Retries=5 update -q
          sudo apt-get -o Acquire::Retries=5 install -y -q --no-install-recommends libegl1 libegl-mesa0 libgl1-mesa-dri libgbm1

      - name: "🌐 Web test build: run the e2e flow in headless Chrome"
        run: |
          export CHROME="$HOME/tools/chrome-headless-shell-linux64/chrome-headless-shell"
          export PLAYWRIGHT_BROWSERS_PATH="$HOME/tools/playwright"
          export CHROME_GL=mesa
          timeout 300 uv run --locked --package khovax-game-web-e2e packages/game-web-e2e/web_e2e.py build/web-test

      - name: "⬆️ 🎬 Web e2e video: upload (web-e2e-video)"
        # The run on film (owner, #115), also when it failed.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-e2e-video
          path: build/web-test-video/
          retention-days: 14
          if-no-files-found: error

  pages:
    # The playable web build at https://coarisfinia.github.io/khovax/ (#23): on every push to main whose
    # checks all pass, the web build the export job just made is published as it is, not
    # built again. Pull requests never deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [headless, models, export, apk-e2e, web-e2e]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # One deploy at a time: one under way is never cancelled, and a newer one waiting replaces an
    # older one waiting, since only the latest build matters.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: "⬇️ 🌐 Web build: download (khovax-web)"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: khovax-web
          path: site

      - name: "📦 🌐 Web build: package it for GitHub Pages"
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: "🚀 🌐 Web build: deploy to GitHub Pages"
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  dev-release:
    # A dev release on every push to main whose checks all pass (#1312, #747: one kept prerelease per
    # build), with the builds the export job just made attached as plain files, never zips: the
    # Android APK, the Windows .exe, the Linux executable and the web build's files. Its tag is the
    # version the export job stamped into them (#744). It checks out only project.godot, for the
    # game's name, and runs nothing from the repository. Pull requests and the merge queue never
    # release.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [headless, models, export, apk-e2e, linux-e2e, web-e2e]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      # Creating the release creates its tag. A tag made with the workflow's token starts no
      # workflow, so release.yml doesn't run for it either.
      contents: write
    steps:
      - name: "📥 Check out the game's project settings"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: packages/game/project.godot
          sparse-checkout-cone-mode: false

      - name: "⬇️ 📦 Builds: download (khovax-debug-apk, khovax-windows, khovax-linux, khovax-web)"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: khovax-{debug-apk,windows,linux,web}
          path: builds

      - name: "🚀 Create the dev release"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.export.outputs.tag }}
        run: |
          # The tag is the version the export job stamped into these builds (#744).
          tag="$TAG"
          # A rerun of this run finds its release already published, or the draft a failed upload
          # left, which has no tag yet and is made again. Any error but "release not found" (a rate
          # limit, an outage) fails the job, so it is never mistaken for "none".
          if draft=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft \
            2> "$RUNNER_TEMP/release-view.err"); then
            :
          elif [ "$(< "$RUNNER_TEMP/release-view.err")" != 'release not found' ]; then
            cat "$RUNNER_TEMP/release-view.err" >&2
            exit 1
          else
            draft=
          fi
          if [ "$draft" = false ]; then
            echo "${tag} already exists"
            exit 0
          elif [ "$draft" = true ]; then
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
          fi
          # Named after the game's display name, as release.yml names its files.
          name=$(awk -F'"' '/^\[/ { section = $0 } section == "[application]" && /^config\/name="/ { print $2 }' \
            packages/game/project.godot | tr ' ' '-' | tr -cd 'A-Za-z0-9._-' | sed 's/^[-.]*//')
          name=${name:-khovax}
          mkdir upload
          cp builds/khovax-debug-apk/khovax.apk "upload/${name}-${tag}-android.apk"
          cp builds/khovax-windows/khovax.exe "upload/${name}-${tag}-windows-x86_64.exe"
          cp builds/khovax-linux/khovax.x86_64 "upload/${name}-${tag}-linux.x86_64"
          files=(upload/*)
          # The web build's files keep their names, which its index.html loads them by.
          for file in builds/khovax-web/*; do
            files+=("${file}#web: $(basename "$file")")
          done
          pages="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          notes="Dev build of ${GITHUB_SHA}, made by [this CI run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}).
          The Android APK is signed with a throwaway debug key: uninstall an older build before installing it. The Linux file needs \`chmod +x\` after downloading. The web build is playable at ${pages}; its files here run when served from one folder."
          # The changes since the previous dev release; the very first lists none, not the whole history.
          previous=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 100 --json tagName \
            --jq '[.[] | select(.tagName | test("^v[0-9]+[.][0-9]+[.][0-9]+-dev[.][0-9]+$"))][0].tagName // empty')
          start=()
          if [ -n "$previous" ]; then
            start=(--generate-notes --notes-start-tag "$previous")
          fi
          # A draft until every file is up: the tag, which can't be moved or deleted, comes with
          # publishing it.
          gh release create "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --draft --prerelease --title "$tag" --notes "$notes" "${start[@]}"
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
