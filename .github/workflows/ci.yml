name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels that pull request's run for the previous commit. Every run
# on main gets its own group, so none is ever cancelled or queued behind another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  # Same version as tools/scoop/gdstyle.json; the checksum is of the Linux release archive.
  GDSTYLE_VERSION: 0.3.3
  GDSTYLE_SHA256: afc3c7a1b9fba219a2eeb2b3896470babffe010b6cf9f3a8c9526a2f6155d64c
  # Checksums of Godot's Linux editor and export templates for GODOT_VERSION, from the release's
  # SHA512-SUMS.txt; bump them with the version. The cache keys include them, so a cache only ever
  # holds what was verified against them.
  GODOT_SHA512: 9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65
  GODOT_TEMPLATES_SHA512: ca4d71c4d7b81dfc15d1a98baa07534aa95b03fdda78a0075b06672e1648d2e5f40980c9adc28d23e1b92e732ee7bf3461997aa804af74ec2fcd7a93ccb84079
  # jv, the JSON Schema validator for the content data (#72); the checksum is of its Linux release
  # archive, as GitHub records it for the release asset.
  JV_VERSION: 6.0.3
  JV_SHA256: 36e9ab8481cc8e2cb27c8336decc9abdcbd606b05792ca88d6188e01ec28766b

jobs:
  headless:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install gdstyle
        run: |
          curl -fsSL -o /tmp/gdstyle.tar.gz \
            "https://github.com/atelico/gdstyle/releases/download/v${GDSTYLE_VERSION}/gdstyle-x86_64-unknown-linux-gnu.tar.gz"
          echo "${GDSTYLE_SHA256}  /tmp/gdstyle.tar.gz" | sha256sum --check
          sudo tar xzf /tmp/gdstyle.tar.gz -C /usr/local/bin gdstyle

      - name: Lint GDScript
        run: gdstyle check --no-color .

      - name: Check GDScript formatting
        run: gdstyle fmt --check .

      - name: Keep the simulation deterministic
        # sim/ holds the rules: plain RefCounted classes without nodes, input, time, engine or OS
        # state, global randomness, frame delta or floats (see AGENTS.md, "Architecture").
        # Comments are stripped first (a # outside strings), so the rules can be explained in them.
        run: |
          forbidden='\b(Node|Node2D|Node3D|CanvasItem|Control|Window|Viewport|Resource)\b|\b(Input|InputMap|Time|Engine|OS|DisplayServer|RenderingServer|ProjectSettings)\.|\b(randf|randi|randf_range|randi_range|randfn|randomize|seed|rand_from_seed)\(|\bdelta\b|\bfloat\b|[0-9]\.[0-9]|[0-9][eE][-+]?[0-9]'
          failed=0
          # A sim/ script extends RefCounted, or another class of sim/ (e.g. Feature).
          sim_classes=$(grep -rh '^class_name ' sim | awk '{print $2}' | paste -sd'|' -)
          while read -r file; do
            code=$(perl -pe 's/^((?:[^"'"'"'#]|"(?:\\.|[^"\\])*"|'"'"'(?:\\.|[^'"'"'\\])*'"'"')*)#.*$/$1/' "$file")
            if ! grep -qxE "extends (RefCounted|${sim_classes})" <<< "$code"; then
              echo "::error file=${file}::sim/ scripts extend RefCounted or a class of sim/"
              failed=1
            fi
            if grep -nE "$forbidden" <<< "$code"; then
              echo "::error file=${file}::sim/ must stay deterministic: see the lines above"
              failed=1
            fi
          done < <(find sim -name '*.gd')
          exit "$failed"

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-${{ env.GODOT_SHA512 }}

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          echo "${GODOT_SHA512}  /tmp/godot.zip" | sha512sum --check
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot

      - name: Import project
        # Tool scripts run during the import too; a script error there passes silently otherwise.
        run: |
          timeout 120 ~/godot/godot --headless --path . --import 2>&1 | tee /tmp/import.log
          test "${PIPESTATUS[0]}" -eq 0
          if grep -q "SCRIPT ERROR" /tmp/import.log; then
            echo "::error::a script failed during the import"
            exit 1
          fi

      - name: Check the content data against its schemas
        # data_to_json.gd strips the JSONC comments with the game's own stripper; jv then checks
        # each data/<folder>/ file against data/schemas/<folder>.schema.json.
        run: |
          curl -fsSL -o /tmp/jv.tar.gz             "https://github.com/santhosh-tekuri/jsonschema/releases/download/v${JV_VERSION}/jv-v${JV_VERSION}-linux-amd64.tar.gz"
          echo "${JV_SHA256}  /tmp/jv.tar.gz" | sha256sum --check
          mkdir -p /tmp/jv && tar xzf /tmp/jv.tar.gz -C /tmp/jv
          jv=$(find /tmp/jv -type f -name jv | head -1)
          timeout 60 ~/godot/godot --headless --path . -s res://tools/data_to_json.gd
          # Godot exits 0 even when a script fails to compile, so check every file was converted.
          test "$(find data -name '*.jsonc' | wc -l)" -eq "$(find build/data-json -name '*.json' | wc -l)"
          for folder in build/data-json/*/; do
            name=$(basename "$folder")
            for file in "$folder"*.json; do
              "$jv" "data/schemas/${name}.schema.json" "$file"
            done
          done

      - name: Check every script with Godot's warnings as errors
        # Also catches scripts that no test loads.
        run: |
          git ls-files '*.gd' | while read -r script; do
            timeout 60 ~/godot/godot --headless --path . --check-only -s "res://${script}" \
              || { echo "::error file=${script}::fails Godot's script check"; exit 1; }
          done

      - name: Run e2e tests
        # timeout guards against a script error in the runner leaving the SceneTree running forever
        run: timeout 300 ~/godot/godot --headless --path . -s res://tests/e2e/run_e2e.gd

  android:
    # A debug APK to install on a phone (#59), exported with Godot's Android export templates, the
    # Android SDK and Java already on the runner, and a throwaway debug key: no secrets.
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-${{ env.GODOT_SHA512 }}

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          echo "${GODOT_SHA512}  /tmp/godot.zip" | sha512sum --check
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot

      - name: Cache the Android export templates
        id: cache-templates
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-android-${{ env.GODOT_VERSION }}-${{ env.GODOT_TEMPLATES_SHA512 }}

      - name: Download the Android export templates
        # The archive holds every platform's templates; only Android's are kept, so the cache stays small.
        if: steps.cache-templates.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          echo "${GODOT_TEMPLATES_SHA512}  /tmp/templates.tpz" | sha512sum --check
          target=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$target"
          unzip -q -j /tmp/templates.tpz \
            templates/android_debug.apk templates/android_release.apk templates/version.txt -d "$target"

      - name: Point Godot at the runner's Android SDK and Java
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME_17_X64}"
          SETTINGS

      - name: Make a throwaway debug key
        run: |
          keytool -genkeypair -v -keystore /tmp/debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Import project
        # Tool scripts run during the import too; a script error there passes silently otherwise.
        run: |
          timeout 120 ~/godot/godot --headless --path . --import 2>&1 | tee /tmp/import.log
          test "${PIPESTATUS[0]}" -eq 0
          if grep -q "SCRIPT ERROR" /tmp/import.log; then
            echo "::error::a script failed during the import"
            exit 1
          fi

      - name: Export the debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /tmp/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          timeout 300 ~/godot/godot --headless --path . --export-debug "Android" build/khovax.apk
          test -s build/khovax.apk
          # The test APK for the emulator: x86_64, with the APK's e2e flow (tests/apk/) inside.
          timeout 300 ~/godot/godot --headless --path . --export-debug "Android Test" build/khovax-test.apk
          test -s build/khovax-test.apk

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: khovax-debug-apk
          path: build/khovax.apk
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: khovax-test-apk
          path: build/khovax-test.apk
          retention-days: 3

  apk-e2e:
    # The one e2e flow on the APK (#61), on an Android emulator: the test APK's flow walks the player
    # with the touch stick from a fixed seed and must end in the state the headless run pins.
    needs: android
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: khovax-test-apk
          path: build

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'             | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the APK's e2e flow on an emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: timeout 300 bash tools/apk_e2e.sh build/khovax-test.apk
