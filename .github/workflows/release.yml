name: release

# A version tag (v1.2.3) makes a GitHub release with the desktop and web builds attached (#21,
# #22, #92). The tag must match application/config/version in packages/game/project.godot; the
# README says how to cut one. The build runs read-only; only the release job, which runs no project
# code, may write.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  # Godot's version and checksums are pinned once, in .github/actions/setup-godot (#924).
  UV_VERSION: 0.13.4
  UV_SHA256: 2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    outputs:
      zip: ${{ steps.export.outputs.zip }}
      web: ${{ steps.export.outputs.web }}
      linux: ${{ steps.export.outputs.linux }}
    # Every step runs in the game's project (#1101), where its version and builds are; the Python
    # tooling is beside it, in ../<package>/.
    defaults:
      run:
        working-directory: packages/game
    steps:
      - name: "📥 Check out the code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "🏷️ Check the tag matches the game's version"
        # The version is read from [application] only, and must be a plain x.y.z.
        run: |
          version=$(awk -F'"' '/^\[/ { section = $0 } section == "[application]" && /^config\/version="/ { print $2 }' project.godot)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} doesn't match config/version \"${version}\" (x.y.z) in project.godot"
            exit 1
          fi

      - name: "🧰 Install uv (the Python tooling's runner)"
        run: |
          curl -fsSL -o /tmp/uv.tar.gz \
            "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz"
          echo "${UV_SHA256}  /tmp/uv.tar.gz" | sha256sum --check
          sudo tar xzf /tmp/uv.tar.gz -C /usr/local/bin --strip-components=1 \
            uv-x86_64-unknown-linux-gnu/uv

      - name: "🤖 Set up Godot and its export templates, and import the project"
        uses: ./.github/actions/setup-godot
        with:
          # Not cached: releases are rare, and a release is built from verified downloads only.
          cache: "false"
          templates: "true"

      - name: "📦 Windows + Linux + web: export and pack the release builds"
        id: export
        # Files are named after the game's display name, so renaming the game needs no change here;
        # only letters, digits, dots, dashes and underscores are kept, and never a leading dash.
        run: |
          mkdir -p build/zip
          timeout 300 ~/godot/godot --headless --path . --export-release "Windows Desktop" build/khovax.exe
          test -s build/khovax.exe
          name=$(awk -F'"' '/^\[/ { section = $0 } section == "[application]" && /^config\/name="/ { print $2 }' project.godot \
            | tr ' ' '-' | tr -cd 'A-Za-z0-9._-' | sed 's/^[-.]*//')
          name=${name:-khovax}
          cp build/khovax.exe "build/zip/${name}.exe"
          zip="${name}-${GITHUB_REF_NAME}-windows-x86_64.zip"
          (cd build/zip && zip -q -- "../${zip}" "${name}.exe")
          echo "zip=${zip}" >> "$GITHUB_OUTPUT"
          mkdir -p build/web
          timeout 300 ~/godot/godot --headless --path . --export-release "Web" build/web/index.html
          test -s build/web/index.html && test -s build/web/index.wasm && test -s build/web/index.pck
          web="${name}-${GITHUB_REF_NAME}-web.zip"
          (cd build/web && zip -q -r -- "../${web}" .)
          echo "web=${web}" >> "$GITHUB_OUTPUT"
          # A tar.gz keeps the executable bit, which a zip from here loses on extraction.
          timeout 300 ~/godot/godot --headless --path . --export-release "Linux" build/khovax.x86_64
          test -s build/khovax.x86_64
          mkdir -p build/linux && cp build/khovax.x86_64 "build/linux/${name}.x86_64"
          chmod +x "build/linux/${name}.x86_64"
          linux="${name}-${GITHUB_REF_NAME}-linux-x86_64.tar.gz"
          tar -czf "build/${linux}" -C build/linux "${name}.x86_64"
          echo "linux=${linux}" >> "$GITHUB_OUTPUT"

      - name: "⬆️ 📦 Release builds: upload (Windows, Linux and web archives)"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-builds
          path: |
            packages/game/build/${{ steps.export.outputs.zip }}
            packages/game/build/${{ steps.export.outputs.web }}
            packages/game/build/${{ steps.export.outputs.linux }}
          retention-days: 3

  release:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      # Only this job may create the release; it checks out and runs nothing from the repository.
      contents: write
    steps:
      - name: "⬇️ 📦 Release builds: download"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-builds

      - name: "🚀 Create the GitHub release"
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ needs.build.outputs.zip }}
          WEB: ${{ needs.build.outputs.web }}
          LINUX: ${{ needs.build.outputs.linux }}
        run: |
          # The tag must still point at the commit that was built: a tag moved since then fails.
          tagged=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}" --jq .sha)
          if [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} now points at ${tagged}, not the built ${GITHUB_SHA}"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "$ZIP" "$WEB" "$LINUX" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --generate-notes
