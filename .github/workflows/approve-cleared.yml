# Approves a pull request once it is labelled `subagent-cleared` (#1874, the owner's pick on #1867).
# The approval is permanent, like the owner's (the owner's pick 2 on #1895, #1900): later pushes or
# a new base never withdraw it. The one exception is a pull request that changed while it was
# being approved: that approval is taken back at once, as nobody cleared the new commits.
#
# The merge queue requires one approving review ("main approval") and doesn't apply the agent
# bot's bypass, and the bot can't approve its own pull requests. A pull request that isn't
# user-facing is cleared by the main session's review subagent, which then labels it
# `subagent-cleared`; this workflow turns that label into the approval the queue needs.
#
# The label counts only when the agent bot or a human admin of the repository (the owner) put it
# on, and only for a pull request into the default branch. Whether a pull request is user-facing is
# the review subagent's call (the owner's pick 1 on #2061: `.github/` and game code nobody sees may
# be cleared, and when in doubt it is user-facing); this file refuses only what always is (the
# owner's pick 1 on #1874), and any workflow change that could reach a protected environment. The approval comes from a separate reviewer GitHub App, whose key is a
# secret of the `approve-cleared` environment, which only `main` may use (the owner's second pick
# 1 on #1874): workflows on other branches can't approve, and "Allow GitHub Actions to create and
# approve pull requests" stays off. `pull_request_target` is the one exception to AGENTS.md's ban
# on it: it runs this file from the base branch, so it must never check out or run anything from
# the pull request, and it doesn't.
name: approve-cleared

on:
  pull_request_target:
    types: [labeled]

# The workflow's own token only reads; approving and dismissing use the reviewer app's token.
permissions:
  contents: read
  pull-requests: read

jobs:
  approve:
    if: github.event.action == 'labeled' && github.event.label.name == 'subagent-cleared'
    # One approval per pull request at a time.
    concurrency:
      group: approve-cleared-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    environment: approve-cleared
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD: ${{ github.event.pull_request.head.sha }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check that the agent bot or the owner cleared it and it can't reach the guard
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SENDER: ${{ github.event.sender.login }}
          SENDER_TYPE: ${{ github.event.sender.type }}
          BOT: coarisfinia-ai-agent[bot]
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          # A failing reader inside a pipe must fail its check, not pass an empty answer on.
          set -o pipefail
          if [ "$SENDER" = "$BOT" ]; then
            who="the agent bot"
          elif [ "$SENDER_TYPE" = User ] &&
            [ "$(gh api "repos/$REPO/collaborators/$SENDER/permission" --jq .permission)" = admin ]; then
            who="an admin"
          else
            echo "Not approving #$PR: '$SENDER' put the label subagent-cleared on, and only the" \
              "agent bot or a human admin of the repository may clear a pull request."
            exit 0
          fi
          # The pull request as it is now: the same commits as labelled, into the default branch.
          if [ "$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha + " " + .base.ref')" != "$HEAD $DEFAULT_BRANCH" ]; then
            echo "Not approving #$PR: its commits or its base changed after the label, or it" \
              "doesn't go into $DEFAULT_BRANCH; clear it again."
            exit 0
          fi
          # The bot that labels is also the bot that opens pull requests, so the label alone could
          # approve a user-facing one (#1874). The game itself is user-facing; its tests and tools
          # aren't. The files come from the labelled commits, one JSON string per line ("F" for a
          # file's path, "P" for the path a rename came from, which counts too), so a newline in
          # a name can't split it. A list that can't be read in full approves nothing. It is
          # compared against the default branch, as GitHub counts `changed_files`.
          files=$(gh api --paginate "repos/$REPO/compare/$DEFAULT_BRANCH...$HEAD" --jq '.files[]? |
            ("F" + (.filename | @json)), (select(.previous_filename) | "P" + (.previous_filename | @json))')
          if [ "$(printf '%s\n' "$files" | grep -c '^F"')" -ne "$CHANGED_FILES" ]; then
            echo "Not approving #$PR: its list of changed files couldn't be read in full."
            exit 0
          fi
          # The guard never approves a change to itself (#1874). Any job on `main` that names the
          # reviewer app's environment gets its key, and the release key lives in an environment
          # too, so a changed workflow may name none but `github-pages` (no secrets), and as a
          # plain name: a name built at run time could be any. A job calling another workflow
          # (`uses:`) could reach one through it, even an unchanged one, so it needs the owner too.
          # Each changed workflow is read as data from its blob, never checked out or run, and one
          # that can't be listed, read or parsed approves nothing. A removed one can reach nothing.
          # Other `.github/` files may be cleared (#2061): no job of this file uses them.
          workflows=$(gh api --paginate "repos/$REPO/compare/$DEFAULT_BRANCH...$HEAD" --jq '.files[]? |
            select(.status != "removed" and (.filename | startswith(".github/workflows/"))) |
            .sha + " " + (.filename | @json)') ||
            { echo "Not approving #$PR: its changed workflows couldn't be listed."; exit 0; }
          command -v yq > /dev/null || { echo "Not approving #$PR: yq is missing."; exit 0; }
          while read -r blob name; do
            [ -n "$blob" ] || continue
            if ! gh api -H "Accept: application/vnd.github.raw+json" "repos/$REPO/git/blobs/$blob" \
                > "$RUNNER_TEMP/workflow.yml" ||
              ! reach=$(yq -o=json 'explode(.)' "$RUNNER_TEMP/workflow.yml" | jq -r '
                (.jobs // {}) | to_entries[] | .key as $job | .value |
                ((select(has("environment")) | .environment |
                  (if type == "object" then .name else . end) as $env |
                  select(($env | type) != "string" or ($env | ascii_downcase) != "github-pages") |
                  "job \($job | @json) deploys to the environment \($env | @json)"),
                 (select(has("uses")) | "job \($job | @json) calls \(.uses | @json)"))'); then
              echo "Not approving #$PR: the workflow $name couldn't be read as a workflow."
              exit 0
            fi
            if [ -n "$reach" ]; then
              echo "Not approving #$PR: the workflow $name could reach a protected environment," \
                "which always needs the owner's approval:"
              printf '%s\n' "$reach"
              exit 0
            fi
          done <<< "$workflows"
          # The game's assets, texts and world, and its scenes, resources and media, are always
          # user-facing; its code is the review subagent's call (#2061). Its tests and tools never are.
          user_facing=$(printf '%s\n' "$files" | cut -c2- | grep '^"packages/game/' |
            grep -v -e '^"packages/game/tests/' -e '^"packages/game/tools/' |
            grep -i -e '^"packages/game/\(assets\|translations\|realms\|regions\)/' \
              -e '\.\(tscn\|tres\|res\|import\|png\|svg\|jpg\|jpeg\|webp\|glb\|gltf\|bin\|ogg\|wav\|mp3\|ttf\|otf\|gdshader\|gdshaderinc\)"$' ||
            true)
          if [ -n "$user_facing" ]; then
            echo "Not approving #$PR: it changes files that are always user-facing, which need the" \
              "owner's approval:"
            printf '%s\n' "$user_facing"
            exit 0
          fi
          echo "#$PR at $HEAD may be approved: $who ('$SENDER') labelled it subagent-cleared."
          echo "sender=$SENDER" >> "$GITHUB_OUTPUT"
      - name: Get the reviewer app's token
        if: steps.check.outputs.sender
        id: reviewer
        # actions/create-github-app-token v3.3.0
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ vars.REVIEWER_APP_ID }}
          private-key: ${{ secrets.REVIEWER_APP_KEY }}
          permission-pull-requests: write
      - name: Approve as the reviewer app
        if: steps.check.outputs.sender
        env:
          GH_TOKEN: ${{ steps.reviewer.outputs.token }}
          SENDER: ${{ steps.check.outputs.sender }}
        run: |
          body="Approved because \`$SENDER\` labelled it \`subagent-cleared\`: a review subagent"
          body+=" found nothing blocking in this pull request, which isn't user-facing (#1874, #2061)."
          # Pinned to the commit that was checked, so the review shows what was cleared.
          review=$(gh api --method POST "repos/$REPO/pulls/$PR/reviews" -f commit_id="$HEAD" \
            -f event=APPROVE -f body="$body" --jq .id)
          echo "Approved: review $review."
          # A push or a new base during the checks means the approval is for commits nobody
          # cleared: take it back at once (the only time it is withdrawn).
          if [ "$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha + " " + .base.ref')" != "$HEAD $DEFAULT_BRANCH" ]; then
            gh api --method PUT "repos/$REPO/pulls/$PR/reviews/$review/dismissals" -f event=DISMISS \
              -f message="It changed while it was being approved: clear it again (#1874)." --silent
            echo "Withdrawn: its commits or its base changed while it was being approved."
          fi
