# The resource pack builder (#1869): a member of the repository's uv workspace (the root
# pyproject.toml).
[project]
name = "khovax-game-pack-builder"
version = "0.0.0"
requires-python = "==3.14.8"
dependencies = ["khovax-game-shared"]

[tool.uv]
package = false

[tool.uv.sources]
khovax-game-shared = { workspace = true }
