# The web build's e2e flow in headless Chrome (#102, #1041): a member of the repository's uv
# workspace (the root pyproject.toml). Playwright drives the pinned Chrome CI downloads; its own
# browsers are never installed.
[project]
name = "khovax-game-web-e2e"
version = "0.0.0"
requires-python = "==3.14.8"
dependencies = ["playwright==1.64.0"]

[tool.uv]
package = false
