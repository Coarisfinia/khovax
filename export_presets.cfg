[preset.3.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/export_icon=true
html/custom_html_shell=""
html/head_include="<!-- The loading screen, the same in both web presets. Once the download is done the engine compiles its renderer's shaders before the first frame, blocking the page, and a full, still bar there looks like a hang (#261): so the bar fades into the fog, the page's background, with a CSS opacity transition, which the browser's compositor keeps running while the page is blocked. A mutation observer watches the bar until it's full or hidden (a load error), since the last progress can come right before the block with no frame between. A caption says what's happening (#270): Downloading while the bar fills, then Starting the game, set before the block so it shows through it; it goes with the loading screen, and the boot scene's fog takes over in the same place. A tiny snake game (#264, the second script, minified) is playable during the download, freezes while the engine starts and goes with the loading screen, its listeners removed, so it never takes the game's input. The web e2e checks the captions in order and the snake. --><style>#status-progress{will-change:opacity;transition:opacity .25s ease-out}#status-progress.loaded{opacity:0}#khovax-start{position:absolute;left:0;right:0;bottom:10%;text-align:center;font:600 1.1rem/1.4 system-ui,sans-serif;color:#4a5060;opacity:0;will-change:opacity;transition:opacity .4s ease-out .2s}#khovax-start.shown{opacity:1}#khovax-snake{border-radius:8px}</style><script>(function fade(){var bar=document.getElementById(\"status-progress\");if(!bar){requestAnimationFrame(fade);return}var start=document.createElement(\"div\");start.id=\"khovax-start\";start.textContent=\"Downloading…\";bar.parentNode.appendChild(start);void start.offsetWidth;start.classList.add(\"shown\");function check(){if(bar.style.display===\"none\"){watch.disconnect();start.remove()}else if(bar.max>0&&bar.value>=bar.max){watch.disconnect();bar.classList.add(\"loaded\");start.textContent=\"Starting the game…\"}}var watch=new MutationObserver(check);watch.observe(bar,{attributes:true});check()})()</script><script>(function snake(){var bar=document.getElementById('status-progress');if(!bar){requestAnimationFrame(snake);return}var N=12,S=14,c=document.createElement('canvas'),g=c.getContext('2d'),keys={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]},body,dir,next,food,started,last=0,sx,sy;c.id='khovax-snake';c.width=c.height=N*S;bar.parentNode.insertBefore(c,bar);function on(p,from){return body.slice(from||0).some(function(b){return b[0]===p[0]&&b[1]===p[1]})}function place(){do{food=[Math.floor(Math.random()*N),3+Math.floor(Math.random()*(N-3))]}while(on(food))}function reset(){body=[[5,6],[4,6],[3,6]];dir=next=[1,0];started=false;place();draw()}function draw(){g.fillStyle='#ccd2e1';g.fillRect(0,0,N*S,N*S);g.fillStyle='#4a5060';body.forEach(function(b){g.fillRect(b[0]*S+1,b[1]*S+1,S-2,S-2)});g.beginPath();g.arc(food[0]*S+S/2,food[1]*S+S/2,S/3,0,7);g.fill();if(!started){g.font='600 12px system-ui,sans-serif';g.textAlign='center';g.fillText('Arrow keys or swipe',N*S/2,S*2)}}function turn(d){if(d[0]===-dir[0]&&d[1]===-dir[1]){if(started)return;body.reverse()}next=d;started=true}function key(e){var d=keys[e.key];if(d&&c.isConnected){e.preventDefault();turn(d)}}function touch(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY}function swipe(e){var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(c.isConnected&&Math.max(Math.abs(dx),Math.abs(dy))>20){turn(Math.abs(dx)>Math.abs(dy)?[Math.sign(dx),0]:[0,Math.sign(dy)])}}function step(){dir=next;var h=[(body[0][0]+dir[0]+N)%N,(body[0][1]+dir[1]+N)%N];var ate=h[0]===food[0]&&h[1]===food[1];body.unshift(h);if(!ate){body.pop()}if(on(h,1)||ate&&body.length>=N*(N-3)){reset();return}if(ate){place()}draw()}function loop(t){if(!c.isConnected||bar.style.display==='none'){removeEventListener('keydown',key);removeEventListener('touchstart',touch);removeEventListener('touchend',swipe);c.remove();return}if(started&&t-last>=300){last=t;step()}requestAnimationFrame(loop)}addEventListener('keydown',key);addEventListener('touchstart',touch);addEventListener('touchend',swipe);reset();requestAnimationFrame(loop)})()</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false

