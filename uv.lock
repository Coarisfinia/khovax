version = 1
revision = 5
requires-python = "==3.14.8"

[manifest]
members = [
    "khovax-build",
    "khovax-checks",
    "khovax-models",
    "khovax-offscreen",
    "khovax-replays",
    "khovax-tools",
]

[[package]]
name = "khovax-build"
version = "0.0.0"
source = { virtual = "packages/build" }

[[package]]
name = "khovax-checks"
version = "0.0.0"
source = { virtual = "packages/checks" }

[[package]]
name = "khovax-models"
version = "0.0.0"
source = { virtual = "packages/models" }

[[package]]
name = "khovax-offscreen"
version = "0.0.0"
source = { virtual = "packages/offscreen" }

[[package]]
name = "khovax-replays"
version = "0.0.0"
source = { virtual = "packages/replays" }

[[package]]
name = "khovax-tools"
version = "0.0.0"
source = { virtual = "." }
